<style>
:root{color-scheme:dark;--bg:#0a0612;--fg:#fff7ea;--dim:rgba(255,247,234,.66);--faint:rgba(255,247,234,.38);--acc:#ffcf3a;--acc2:#ff9a3a;--hot:#ff3cac;--red:#ff3b5c;--cool:#39e6ff;--good:#6cff5a;
 --panel:linear-gradient(180deg,rgba(40,22,64,.9),rgba(18,10,32,.92));--glass:rgba(16,8,30,.58);--edge:rgba(255,255,255,.14);--ink:#1a0e24;
 --disp:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:var(--body);color:var(--fg)}
#wrap{position:relative;width:min(100vw,177.78vh);max-width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;container-type:inline-size}
#c{width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(10,4,20,.5) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;mix-blend-mode:screen}
/* ---------- HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--disp);font-weight:800;transition:opacity .4s;text-shadow:0 .2cqw 0 rgba(0,0,0,.45)}
.hud.off{opacity:0}
.pill{background:var(--glass);border:.12cqw solid var(--edge);border-radius:2cqw;backdrop-filter:blur(.4cqw);box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.25)}
.tl{position:absolute;left:1.6cqw;top:1.4cqw;padding:.7cqw 1.4cqw;line-height:1.15}
#hMode{font-size:1.9cqw;color:#fff}
#hMood{font-family:var(--body);font-size:.95cqw;color:#ffd98a;font-weight:800;letter-spacing:.03cqw}
#hLet{display:flex;gap:.45cqw;margin-top:.5cqw}
#hLet i{font-style:normal;font-size:1.05cqw;width:2cqw;height:2cqw;display:grid;place-items:center;border-radius:.6cqw;border:.15cqw solid rgba(255,207,58,.4);color:rgba(255,207,58,.45);background:rgba(0,0,0,.25);text-shadow:none}
#hLet i.on{border-color:#fff3a0;color:var(--ink);background:linear-gradient(180deg,#fff3a0,#ffc21a);box-shadow:0 0 1cqw rgba(255,207,58,.8)}
.tc{position:absolute;left:50%;top:1.4cqw;transform:translateX(-50%);display:flex;gap:1.8cqw;align-items:center;padding:.5cqw 1.8cqw;font-size:1.9cqw;font-variant-numeric:tabular-nums}
.tc>div{display:flex;align-items:center;gap:.5cqw}
.gem{display:inline-block;width:1.2cqw;height:1.5cqw;background:linear-gradient(135deg,#e0ffff,#39e6ff 50%,#1a6ab0);clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);filter:drop-shadow(0 0 .5cqw #39e6ff)}
.tok{display:inline-block;width:1.5cqw;height:1.5cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc21a 55%,#b06a00);box-shadow:0 0 .7cqw #ffc21a}
#hScore{color:#fff;letter-spacing:.08cqw}
.tr{position:absolute;right:1.6cqw;top:1.4cqw;text-align:right;padding:.6cqw 1.3cqw;line-height:1.2;font-variant-numeric:tabular-nums}
#hLives{font-size:1.5cqw;min-height:1.6cqw;display:flex;justify-content:flex-end;align-items:center;gap:.35cqw}
#hLives i{display:inline-block;width:1.7cqw;height:1.2cqw;background:radial-gradient(circle at 40% 30%,#ffe98a,#ffc93c 50%,#c8821a);border-radius:1.2cqw 1.2cqw .25cqw .25cqw;box-shadow:0 0 .5cqw rgba(255,200,60,.6)}
#hTime{font-size:1.6cqw;color:#fff}
#hPow{display:flex;gap:.4cqw;justify-content:flex-end;margin-top:.3cqw;font-size:.95cqw;font-family:var(--body)}
#hPow span{padding:.15cqw .7cqw;border-radius:1cqw;background:rgba(0,0,0,.35);border:.12cqw solid currentColor}
.br{position:absolute;right:1.6cqw;bottom:1.6cqw;text-align:right;padding:.6cqw 1.4cqw;font-variant-numeric:tabular-nums}
#hKmh{font-size:3.2cqw;line-height:1;color:#fff}
#spd small{font-size:1cqw;color:#ffd98a;font-family:var(--body);font-weight:900}
.bar{width:15cqw;height:.9cqw;border-radius:1cqw;background:rgba(0,0,0,.45);margin-top:.5cqw;margin-left:auto;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:1cqw;background:linear-gradient(90deg,#39e6ff,#ffcf3a 60%,#ff3b5c)}
.bl{position:absolute;left:1.6cqw;bottom:1.6cqw;font-size:.95cqw;color:rgba(255,247,234,.8);line-height:1.8;transition:opacity 1s;padding:.4cqw 1.2cqw;font-family:var(--body);font-weight:800;text-shadow:none}
.bl b{color:#fff;font-weight:900;background:rgba(255,255,255,.14);border-radius:.4cqw;padding:0 .4cqw}
#strain{position:absolute;left:50%;bottom:6.5cqw;transform:translateX(-50%);width:24cqw;height:1.2cqw;border-radius:1cqw;background:rgba(0,0,0,.5);border:.15cqw solid #fff;opacity:0;transition:opacity .2s;overflow:visible}
#strain i{display:block;height:100%;width:0;border-radius:1cqw;background:linear-gradient(90deg,#ffcf3a,#ff3b5c)}
#strain b{position:absolute;left:0;right:0;top:-2.3cqw;text-align:center;font-size:1.3cqw;color:#ff6a7a}
#banner{position:absolute;left:0;right:0;top:25%;text-align:center;pointer-events:none;opacity:0;font-family:var(--disp)}
#banner .b1{font-size:5.4cqw;font-weight:800;line-height:1;letter-spacing:.1cqw;-webkit-text-stroke:.25cqw var(--ink);paint-order:stroke fill;filter:drop-shadow(0 .45cqw 0 rgba(0,0,0,.5)) drop-shadow(0 0 2cqw currentColor)}
#banner .b2{font-size:1.6cqw;margin-top:.8cqw;color:#fff7ea;font-family:var(--body);font-weight:900;text-shadow:0 .2cqw 0 rgba(0,0,0,.6)}
#banner.show{animation:ban 3.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6) rotate(-4deg)}10%{opacity:1;transform:scale(1) rotate(0)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-2cqw)}}
#pop{position:absolute;left:0;right:0;top:55%;text-align:center;font-family:var(--disp);font-weight:800;font-size:2.8cqw;pointer-events:none;opacity:0;-webkit-text-stroke:.18cqw var(--ink);paint-order:stroke fill;filter:drop-shadow(0 .3cqw 0 rgba(0,0,0,.45))}
#pop.show{animation:pop 1.4s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#prompt{position:absolute;left:0;right:0;top:66%;text-align:center;font-family:var(--disp);font-weight:800;font-size:3.4cqw;pointer-events:none;opacity:0;-webkit-text-stroke:.22cqw var(--ink);paint-order:stroke fill;filter:drop-shadow(0 0 1.4cqw currentColor)}
#prompt.show{animation:prm .95s ease forwards}
@keyframes prm{0%{opacity:0;transform:scale(1.7)}14%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(.92)}}
/* ---------- screens */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding-block:1.5cqw;text-align:center;padding-inline:3cqw;background:radial-gradient(ellipse at 50% 40%,rgba(30,12,48,.72),rgba(8,4,16,.94));transition:opacity .25s}
.ov.hidden{opacity:0;pointer-events:none;visibility:hidden}
#scrTitle{background:linear-gradient(90deg,rgba(10,4,20,.82) 0%,rgba(10,4,20,.55) 42%,rgba(10,4,20,0) 72%);align-items:flex-start;text-align:left;padding-left:5.5cqw}
.logo{font-family:var(--disp);font-weight:800;font-size:8cqw;line-height:.86;letter-spacing:.1cqw;background:linear-gradient(180deg,#fff9d0 0%,#ffd84a 38%,#ff8a2a 68%,#e0304a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill;filter:drop-shadow(0 .6cqw 0 #3a0a20) drop-shadow(0 0 2.4cqw rgba(255,140,40,.45));transform:rotate(-3deg);transform-origin:left}
.sub{margin-top:1.2cqw;font-size:1.25cqw;font-weight:900;color:var(--cool);letter-spacing:.25cqw;text-shadow:0 0 1cqw rgba(57,230,255,.6)}
h2{font-family:var(--disp);font-weight:800;font-size:3.6cqw;color:var(--acc);-webkit-text-stroke:.2cqw var(--ink);paint-order:stroke fill;filter:drop-shadow(0 .35cqw 0 rgba(0,0,0,.5));margin-bottom:1.2cqw;line-height:1}
.list{display:flex;flex-direction:column;gap:.55cqw;margin-top:1.6cqw;width:min(42cqw,100%)}
.list.wide{width:min(66cqw,100%)}
.mi{font:inherit;font-weight:900;font-size:1.35cqw;color:var(--fg);background:rgba(255,255,255,.06);border:.12cqw solid rgba(255,255,255,.1);border-radius:1.4cqw;padding:.72cqw 1.5cqw;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:2cqw;letter-spacing:.03cqw;line-height:1.3;transition:transform .12s,background .12s}
.mi .v{color:var(--acc);white-space:nowrap;font-family:var(--disp);font-weight:800}
.mi small{display:block;font-size:.85cqw;color:var(--dim);margin-top:.2cqw;font-weight:800}
.mi.sel{color:var(--ink);background:linear-gradient(180deg,#fff0a0,#ffc21a);border-color:#fff6c0;box-shadow:0 .35cqw 0 #a86a00,0 0 1.6cqw rgba(255,194,26,.45);transform:translateX(.5cqw)}
.mi.sel .v,.mi.sel small{color:var(--ink)}
.mi.locked{color:var(--faint)}
.mi.locked.sel{background:linear-gradient(180deg,rgba(255,240,160,.45),rgba(255,194,26,.35));color:var(--ink)}
.mi:focus-visible{outline:.2cqw solid var(--cool)}
.desc{margin-top:1.4cqw;font-size:1.05cqw;line-height:1.6;color:var(--dim);min-height:3.6cqw;max-width:62cqw;font-weight:800}
.desc b{color:var(--fg)}
.hint{margin-top:.7cqw;max-width:34cqw;min-height:3.4cqw;text-align:left;font-size:1.05cqw;color:var(--dim);line-height:1.6;font-weight:800}
.best{margin-top:1.2cqw;font-size:1.1cqw;color:#ffd98a;font-weight:900}
.cards{display:flex;gap:1.3cqw;margin-top:.8cqw;flex-wrap:wrap;justify-content:center}
.card{width:16cqw;padding:1cqw .8cqw 1.2cqw;border-radius:1.8cqw;border:.15cqw solid rgba(255,255,255,.14);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:.6cqw;cursor:pointer;transition:transform .15s}
.card canvas{width:13cqw;height:13cqw}
.card.sel{border-color:#fff0a0;box-shadow:0 0 0 .25cqw rgba(255,207,58,.7),0 1cqw 2cqw rgba(0,0,0,.35);transform:translateY(-.6cqw)}
.card.cur b::after{content:' ✓';color:var(--good)}
.card b{font-family:var(--disp);font-weight:800;font-size:1.5cqw}
.card small{font-size:.85cqw;color:var(--dim);line-height:1.45;min-height:2.4cqw;font-weight:800}
.card.locked canvas{filter:brightness(0) drop-shadow(0 0 .4cqw rgba(255,255,255,.5))}
.stats{font-size:1.25cqw;line-height:2;text-align:left;width:min(42cqw,100%);font-variant-numeric:tabular-nums;font-weight:900;background:var(--glass);border-radius:1.6cqw;padding:1cqw 2cqw;border:.12cqw solid var(--edge)}
.stats div{display:flex;justify-content:space-between;gap:3cqw}
.stats span{color:#ffd98a}
.stats .new{color:var(--good)}
.stats.two{width:min(70cqw,100%);columns:2;column-gap:4cqw}
.stats.two div{break-inside:avoid}
.medal{display:inline-block;width:1.2cqw;height:1.2cqw;border-radius:50%;vertical-align:-.15cqw;margin-left:.4cqw;box-shadow:inset -.2cqw -.2cqw 0 rgba(0,0,0,.25)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:.9cqw;margin-top:1.6cqw}
.moods div{border:.15cqw solid;border-radius:1.2cqw;padding:.9cqw .5cqw;font-size:.85cqw;line-height:1.5;background:rgba(0,0,0,.35);opacity:0;transform:translateY(1cqw);animation:mIn .5s ease forwards;font-weight:900}
.moods b{display:block;font-family:var(--disp);font-size:1.25cqw;color:#fff}
@keyframes mIn{to{opacity:1;transform:none}}
.change{margin-top:1.6cqw;font-family:var(--disp);font-weight:800;font-size:2cqw;color:var(--hot);text-shadow:0 0 1.2cqw var(--hot)}
#scrShop .card{width:12.5cqw;padding:.6cqw .6cqw .8cqw;gap:.3cqw}#scrShop .card canvas{width:10cqw;height:10cqw}#scrShop .card b{font-size:1.2cqw}#scrShop .cards{gap:1cqw}
.cats{display:flex;gap:.6cqw;justify-content:center;margin-bottom:.4cqw}.cats span{font-family:var(--disp);font-weight:800;font-size:1.05cqw;padding:.25cqw 1cqw;border-radius:2cqw;border:.13cqw solid rgba(255,255,255,.18);color:var(--dim);cursor:pointer}.cats span.on{background:linear-gradient(180deg,#fff3a0,#ffc21a);color:#1a1020;border-color:#fff0a0}
.wallet{font-family:var(--disp);font-weight:800;font-size:1.8cqw;color:var(--cool);display:flex;align-items:center;gap:.6cqw;justify-content:center;margin-bottom:.4cqw}
textarea.code{width:min(60cqw,100%);height:6cqw;border-radius:1cqw;border:.15cqw solid var(--edge);background:rgba(0,0,0,.45);color:var(--fg);font:800 .85cqw/1.4 ui-monospace,Consolas,monospace;padding:.8cqw;resize:none;margin-top:1cqw;user-select:text;-webkit-user-select:text;touch-action:auto}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
/* ---------- touch */
.touch{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:.25cqw solid rgba(255,255,255,.45);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.22),rgba(20,10,34,.35));display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1.3cqw;color:#fff;touch-action:none;backdrop-filter:blur(.3cqw)}
.tb.on{background:radial-gradient(circle at 40% 35%,rgba(255,240,160,.8),rgba(255,194,26,.5));border-color:#fff}
#tbB{left:3cqw;bottom:3cqw;width:13cqw;height:13cqw}
#tbJ{right:3cqw;bottom:3cqw;width:14cqw;height:14cqw}
#tbS{right:19cqw;bottom:3.5cqw;width:9.5cqw;height:9.5cqw;color:var(--acc)}
#tbP{left:1.6cqw;top:10.5cqw;width:5.5cqw;height:5.5cqw;border-radius:1.4cqw;font-size:1.4cqw}
#wrap.touchon .br{bottom:auto;top:10cqw}
@media (prefers-reduced-motion:reduce){#banner.show,#pop.show,#prompt.show{animation-duration:.01s;opacity:1}.blink{animation:none}.mi,.card{transition:none}}
</style>

<script>
// ==================== core.js
'use strict';
// Utilities, vector helpers, canvases and global constants (HD, resolution-independent rendering).
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ss=t=>t*t*(3-2*t);
const TAU=Math.PI*2;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(n){n=Math.imul((n|0)^0x27d4eb2d,0x9E3779B1);n^=n>>>15;n=Math.imul(n,0x85ebca6b);n^=n>>>13;return(n>>>0)/4294967296}
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function shade(h,f){const c=h2r(h),t=f<0?0:255,p=Math.abs(f);return r2h(...c.map(v=>v+(t-v)*p))}
function mixc(a,b,t){const x=h2r(a),y=h2r(b);return r2h(...x.map((v,i)=>v+(y[i]-v)*t))}
function rgba(h,a){const c=h2r(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function wrapA(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function fmtT(t){if(!isFinite(t))return'--:--.-';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function LG(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<st.length;i+=2)gr.addColorStop(st[i],st[i+1]);return gr}
function RG(g,x,y,r0,r1,st,fx,fy){const gr=g.createRadialGradient(fx==null?x:fx,fy==null?y:fy,r0,x,y,r1);for(let i=0;i<st.length;i+=2)gr.addColorStop(st[i],st[i+1]);return gr}

function RR(g,x,y,w,h,r){g.beginPath();r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const OLW=.55;
const olc=c=>shade(c,-.62);
function fillO(g,fill,out,lw=OLW){g.fillStyle=fill;g.fill();if(out){g.strokeStyle=out;g.lineWidth=lw;g.stroke()}}
function shadeG(g,base,x0,y0,x1,y1,k=.32){return LG(g,x0,y0,x1,y1,[0,shade(base,k),.5,base,1,shade(base,-k)])}

function stroke2(g,pts,w,col,out){g.lineCap='round';g.lineJoin='round';const path=()=>{g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1])};
  if(out){path();g.strokeStyle=out;g.lineWidth=w+OLW*2;g.stroke()}path();g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function curve2(g,x0,y0,cx,cy,x1,y1,w,col,out){g.lineCap='round';const path=()=>{g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1)};if(out){path();g.strokeStyle=out;g.lineWidth=w+OLW*2;g.stroke()}path();g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function eye(g,x,y,r,lx,ly,blink,col='#1a1020',lid){
  if(blink>.86){g.strokeStyle=col;g.lineWidth=r*.34;g.lineCap='round';g.beginPath();g.moveTo(x-r*.9,y);g.quadraticCurveTo(x,y+r*.45,x+r*.9,y);g.stroke();return}
  EL(g,x,y,r*.92,r*1.08);g.fillStyle='#ffffff';g.fill();g.strokeStyle=col;g.lineWidth=r*.2;g.stroke();
  EL(g,x+lx*r*.32,y+ly*r*.3,r*.52,r*.62);g.fillStyle=col;g.fill();
  EL(g,x+lx*r*.32-r*.17,y+ly*r*.3-r*.22,r*.19,r*.19);g.fillStyle='#ffffff';g.fill();
  if(lid){g.fillStyle=lid;g.beginPath();g.ellipse(x,y,r*.95,r*1.1,0,Math.PI*1.05,Math.PI*1.95);g.fill()}}
function star(g,x,y,r1,r2,n=5,rot=-Math.PI/2){g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}

function part(x,y,vx,vy,life,c,sz=1,gr=0,glow=0,k='c'){if(PT.length>900)PT.shift();PT.push({x,y,vx,vy,life,max:life,c,sz,gr,glow,k,rot:Math.random()*TAU,vr:(Math.random()-.5)*8})}
function burst(x,y,n,cols,sp=200,life=.6,gr=420,gl=1,sz=1,k='c'){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random()*.7);part(x,y,Math.cos(a)*v,Math.sin(a)*v-sp*.3,life*(.6+Math.random()*.6),cols[i%cols.length],sz*(.6+Math.random()*.8),gr,gl,k)}}
function dust(x,y,n,c='#d8c8b0'){for(let i=0;i<n;i++)part(x+(Math.random()-.5)*24,y-1,(Math.random()-.5)*90,-Math.random()*50,.6,c,1.6+Math.random()*1.6,60,0)}
function updParts(h){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=h;if(p.life<=0){PT.splice(i,1);continue}p.vy+=p.gr*h;p.x+=p.vx*h;p.y+=p.vy*h;p.vx*=1-h*1.2;p.rot+=p.vr*h}}
function drawParts(g,emis){for(const p of PT){if(!!p.glow!==emis)continue;const a=clamp(p.life/p.max*1.5,0,1);g.globalAlpha=a;const s=p.sz;
  switch(p.k){
    case'b':g.strokeStyle=p.c;g.lineWidth=.35;g.beginPath();g.arc(p.x,p.y,s,0,TAU);g.stroke();g.fillStyle=rgba('#ffffff',.5);g.beginPath();g.arc(p.x-s*.35,p.y-s*.35,s*.25,0,TAU);g.fill();break;
    case'n':g.fillStyle=p.c;g.beginPath();g.ellipse(p.x,p.y,s*.9,s*.65,-.4,0,TAU);g.fill();g.fillRect(p.x+s*.7,p.y-s*2.6,s*.28,s*2.6);g.fillRect(p.x+s*.7,p.y-s*2.6,s*1.1,s*.35);break;
    case's':g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.rot);star(g,0,0,s*1.4,s*.6);g.fill();g.restore();break;
    case'f':g.fillStyle=p.c;g.beginPath();g.ellipse(p.x,p.y,s*.7,s*1.3,0,0,TAU);g.fill();break;
    case'l':g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.beginPath();g.ellipse(0,0,s*1.3,s*.55,0,0,TAU);g.fill();g.restore();break;
    case'p':g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-s*1.6,-s*.5,s*3.2,s);g.restore();break;
    case'q':g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-s,-s*.5,s*2,s);g.restore();break;
    default:if(emis){glow(g,p.x,p.y,s*3.2,p.c,a)}else{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,s*.8,0,TAU);g.fill()}}}
  g.globalAlpha=1}
const WX=[];let wxType='';
const WXCFG={dust:[34,'#caa27a'],dust2:[80,'#a88a6a'],sparkle:[46,'#bff6ff'],leaves:[26,'#8ad040'],rain:[170,'#9ab0d0'],rain2:[110,'#a0c8ff'],embers:[60,'#ff8a2a'],embers2:[120,'#ffaa3a'],ash:[80,'#8a8080'],blizzard:[260,'#ffffff'],drips:[30,'#bfe6ff'],sparks:[0,'#ffe080'],none:[0,'#fff']};
function wxSet(t){if(t===wxType)return;wxType=t;WX.length=0}
function updWx(h,camL,camT,vw,vh){const cfg=WXCFG[wxType]||WXCFG.none;const n=Math.round(cfg[0]*(SET.reduce?.5:1));
  while(WX.length<n)WX.push({x:camL+Math.random()*vw,y:camT+Math.random()*vh,p:Math.random()*9,s:.5+Math.random()});
  while(WX.length>n)WX.pop();
  for(const w of WX){
    switch(wxType){
      case'rain':w.x+=-120*h;w.y+=620*h*w.s;break;
      case'rain2':w.x+=-40*h;w.y+=520*h*w.s;break;
      case'blizzard':w.x+=-420*h*w.s;w.y+=(90+Math.sin(S.T*3+w.p)*60)*h;break;
      case'embers':case'embers2':w.x+=Math.sin(S.T*2+w.p)*20*h-20*h;w.y-=(40+30*w.s)*h;break;
      case'ash':w.x+=-25*h;w.y+=24*h*w.s;break;
      case'leaves':w.x+=(-40+Math.sin(S.T*1.5+w.p)*40)*h;w.y+=36*h*w.s;break;
      case'drips':w.y+=300*h*w.s;break;
      default:w.x+=Math.sin(S.T*.6+w.p)*6*h;w.y+=Math.cos(S.T*.5+w.p)*5*h}
    if(w.x<camL-10)w.x+=vw+20;if(w.x>camL+vw+10)w.x-=vw+20;if(w.y>camT+vh+10)w.y-=vh+20;if(w.y<camT-10)w.y+=vh+20}
  if(wxType==='sparks'&&Math.random()<h*1.2){const x=camL+Math.random()*vw,y=camT+Math.random()*vh*.5;for(let k=0;k<14;k++)part(x,y,(Math.random()-.5)*120,-Math.random()*80,.8,'#ffe080',.8,500,1)}}
function drawWx(g,emis){const cfg=WXCFG[wxType];if(!cfg||!WX.length)return;const em=wxType==='sparkle'||wxType.startsWith('embers');if(em!==emis)return;const col=cfg[1];
  g.lineCap='round';
  for(const w of WX){switch(wxType){
    case'rain':g.strokeStyle=rgba(col,.45);g.lineWidth=.5;g.beginPath();g.moveTo(w.x,w.y);g.lineTo(w.x-2.4,w.y+10*w.s);g.stroke();break;
    case'rain2':g.strokeStyle=rgba(col,.4);g.lineWidth=.45;g.beginPath();g.moveTo(w.x,w.y);g.lineTo(w.x-.6,w.y+8*w.s);g.stroke();break;
    case'blizzard':g.fillStyle=rgba('#ffffff',.85);g.beginPath();g.arc(w.x,w.y,.5+w.s*.6,0,TAU);g.fill();break;
    case'sparkle':glow(g,w.x,w.y,2.6,col,.5+.5*Math.sin(S.T*4+w.p));break;
    case'embers':case'embers2':glow(g,w.x,w.y,2.2+w.s,col,.8);break;
    case'leaves':g.fillStyle=w.p>5?'#e0a030':'#8ad040';g.save();g.translate(w.x,w.y);g.rotate(S.T*2+w.p);g.beginPath();g.ellipse(0,0,1.8,.8,0,0,TAU);g.fill();g.restore();break;
    case'drips':g.strokeStyle=rgba(col,.7);g.lineWidth=.5;g.beginPath();g.moveTo(w.x,w.y);g.lineTo(w.x,w.y+3);g.stroke();break;
    default:g.fillStyle=rgba(col,.5);g.beginPath();g.arc(w.x,w.y,.4+w.s*.4,0,TAU);g.fill()}}}

// ==================== audio.js
// Synth audio: distorted-guitar rock sequencer (one song per world + boss song) and SFX.
const AU={ctx:null};
function distCurve(k){const n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function auVol(){if(!AU.ctx)return;AU.mus.gain.value=SET.mus/10*.6;AU.sfx.gain.value=SET.sfx/10*.9}
function auInit(){
  if(AU.ctx){if(AU.ctx.state!=='running')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.ctx=new AC();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.connect(c.destination);
  AU.master=c.createGain();AU.master.gain.value=.9;AU.master.connect(comp);
  AU.mus=c.createGain();AU.mlp=c.createBiquadFilter();AU.mlp.type='lowpass';AU.mlp.frequency.value=20000;AU.mus.connect(AU.mlp);AU.mlp.connect(AU.master);AU.sfx=c.createGain();AU.sfx.connect(AU.master);auVol();
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
  AU.gIn=c.createGain();AU.gIn.gain.value=2.4;
  const sh=c.createWaveShaper();sh.curve=distCurve(70);sh.oversample='4x';
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;
  const pk=c.createBiquadFilter();pk.type='peaking';pk.frequency.value=750;pk.gain.value=-6;pk.Q.value=1;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3600;lp.Q.value=.7;
  AU.gOut=c.createGain();AU.gOut.gain.value=.13;
  AU.gIn.connect(sh);sh.connect(hp);hp.connect(pk);pk.connect(lp);lp.connect(AU.gOut);AU.gOut.connect(AU.mus);
  AU.dly=c.createDelay(1);AU.dly.delayTime.value=.3;const fb=c.createGain();fb.gain.value=.33;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2600;
  AU.dly.connect(dl);dl.connect(fb);fb.connect(AU.dly);dl.connect(AU.mus);AU.dIn=c.createGain();AU.dIn.gain.value=.55;AU.dIn.connect(AU.dly);
  const loop=(type,f,q)=>{const s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.sfx);s.start();return{f:fl,g}};
  AU.wind=loop('bandpass',500,.7);AU.brk=loop('bandpass',3400,5);AU.rum=loop('lowpass',120,1);
  const so=c.createOscillator();so.type='sawtooth';so.frequency.value=2150;const sf=c.createBiquadFilter();sf.type='bandpass';sf.frequency.value=2150;sf.Q.value=14;AU.scr=c.createGain();AU.scr.gain.value=0;so.connect(sf);sf.connect(AU.scr);AU.scr.connect(AU.sfx);
  const lfo=c.createOscillator();lfo.frequency.value=9;const lg2=c.createGain();lg2.gain.value=70;lfo.connect(lg2);lg2.connect(so.frequency);so.start();lfo.start();
  MU.next=c.currentTime+.08;setInterval(muTick,25);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function osc(type,f,t,dur,dest,vol,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(1e-4,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}
function nz(t,dur,dest,vol,type,freq,q=1,f2){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(1e-4,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*1.4);s.stop(t+dur+.02)}
// ---- instruments
function kick(t,v=1){osc('sine',160,t,.3,AU.mus,1.1*v,40);nz(t,.02,AU.mus,.35*v,'highpass',2500)}
function snare(t,v=1){nz(t,.18,AU.mus,.6*v,'bandpass',1900,.6);osc('triangle',220,t,.09,AU.mus,.35*v,160)}
function hat(t,v=1,open){nz(t,open?.2:.035,AU.mus,.15*v,'highpass',7800)}
function crashC(t){nz(t,1.4,AU.mus,.22,'highpass',4200)}
function tom(t,f){osc('sine',f,t,.26,AU.mus,.65,f*.55)}
function bass(t,m,dur){const c=AU.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=mf(m);f.type='lowpass';f.frequency.setValueAtTime(1000,t);f.frequency.exponentialRampToValueAtTime(200,t+dur);g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(1e-3,t+dur);o.connect(f);f.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.02)}
function gtr(t,m,dur,mute){const c=AU.ctx,g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=mute?850:5200;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.004);g.gain.exponentialRampToValueAtTime(mute?.02:.28,t+(mute?.07:dur*.6));g.gain.linearRampToValueAtTime(0,t+dur);f.connect(g);g.connect(AU.gIn);
  for(const[iv,dt]of[[0,-8],[7,7],[12,3]]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=mf(m+iv);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+.03)}}
function lead(t,m,dur){const c=AU.ctx,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='square';o2.type='sawtooth';o.frequency.value=mf(m);o2.frequency.value=mf(m);o2.detune.value=10;
  const lfo=c.createOscillator(),lgn=c.createGain();lfo.frequency.value=6;lgn.gain.value=7;lfo.connect(lgn);lgn.connect(o.detune);lgn.connect(o2.detune);f.type='lowpass';f.frequency.value=3000;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.085,t+.01);g.gain.setValueAtTime(.085,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(f);o2.connect(f);f.connect(g);g.connect(AU.mus);g.connect(AU.dIn);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.05)})}
function bell(t,m){osc('sine',mf(m),t,.8,AU.mus,.1);osc('sine',mf(m)*2.76,t,.3,AU.dIn,.05)}
function arpN(t,m){osc('square',mf(m),t,.1,AU.dIn,.05);osc('square',mf(m),t,.08,AU.mus,.05)}
function padC(t,m,dur){for(const iv of[0,7,15]){const c=AU.ctx,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=mf(m+iv);f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.3);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(f);f.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.05)}}
// ---- songs (index = world; 5 = boss chase)
const SONGS=[
 {bpm:150,key:40,sc:[0,2,3,5,7,8,10],prog:[0,5,3,6,0,5,6,4],x:'none'},
 {bpm:158,key:45,sc:[0,2,3,5,7,9,10],prog:[0,6,5,6,0,3,4,6],x:'toms'},
 {bpm:146,key:38,sc:[0,2,3,5,7,8,11],prog:[0,5,3,4,0,5,1,4],x:'bells'},
 {bpm:166,key:37,sc:[0,1,3,5,7,8,10],prog:[0,1,0,6,0,1,5,1],x:'double'},
 {bpm:170,key:42,sc:[0,2,3,5,7,8,10],prog:[0,5,2,6,0,5,2,4],x:'arp'},
 {bpm:178,key:40,sc:[0,1,4,5,7,8,10],prog:[0,1,0,1,0,6,5,1],x:'boss'},
];
const semi=(sg,d)=>sg.sc[((d%7)+7)%7]+12*Math.floor(d/7);
const MELS=SONGS.map((sg,si)=>{const R=rng(500+si*7),M=[];let prev=4;for(let bar=0;bar<8;bar++){const row=new Array(16).fill(null),deg=sg.prog[bar];let st=0;while(st<16){if(R()<.74){const len=R()<.3?4:2;const cands=[0,2,4,7].map(c=>deg+c);let d=cands[Math.floor(R()*4)];if(Math.abs(d-prev)>5)d=cands[0]+(prev>deg?4:0);prev=d;row[st]={m:sg.key+24+semi(sg,d),len};st+=len}else st+=2}M.push(row)}return M});
const MU={song:0,next:0,step:0,bar:0,level:2,pend:-1};
function muTick(){const c=AU.ctx;if(!c||c.state!=='running')return;if(MU.next<c.currentTime-.2)MU.next=c.currentTime+.05;
  while(MU.next<c.currentTime+.12){const sg=SONGS[MU.song];const bpm=sg.bpm+Math.min(16,S.lap*5);const sd=60/bpm/4;if(SET.mus>0&&!S.paused)playStep(MU.next,sd);MU.next+=sd;MU.step++;
    if(MU.step>=16){MU.step=0;MU.bar=(MU.bar+1)%8;if(MU.pend>=0&&(MU.bar%4===0||MU.pend===5||MU.song===5)){MU.song=MU.pend;MU.pend=-1;MU.bar=0}}}}
function playStep(t,sd){const sg=SONGS[MU.song],st=MU.step,bar=MU.bar,L=MU.level;const deg=sg.prog[bar],root=sg.key+semi(sg,deg);
  if(L===0){if(st===0)padC(t,root+12,sd*16);if(st%4===2)hat(t,.5);if(st===0&&bar%2===0)kick(t,.5);return}
  if(L===1){if(st%4===0)kick(t,.9);if(bar%2===1&&st>=8)snare(t,.25+(st-8)*.07);if(st%2===0)hat(t,.6)}
  else{
    const dbl=(sg.x==='double'||sg.x==='boss')&&L===3;const kp=dbl?st%2===0:(st===0||st===3||st===8||st===10||(L===3&&st===14));if(kp)kick(t);
    if(st===4||st===12)snare(t);if(L===3&&bar===7&&st>=12)snare(t,.6);
    if(L===3)hat(t,st%2?.55:1);else if(st%2===0)hat(t,st%4?.6:1);
    if(st===0&&bar%4===0)crashC(t);
    if(sg.x==='toms'&&bar%4===3&&st>=8&&st%2===0)tom(t,[220,180,150,120][(st-8)/2]);
  }
  if(st%2===0)bass(t,root-12,sd*1.8);
  if(L===1){gtr(t,root,sd*.9,true)}
  else if(st%2===0){const open=st===0||st===6||(st===12&&bar%2===1);gtr(t,root+(st===12&&bar%2===1?(deg%2?3:5):0),open?sd*3:sd*.9,!open)}
  if(sg.x==='bells'&&st%4===0)bell(t,root+24+[0,7,12,15][(st/4)|0]);
  if(sg.x==='arp'&&L>=2)arpN(t,root+24+[0,3,7,12,15,12,7,3][st%8]);
  if(sg.x==='boss'&&st%2===0)arpN(t,root+36+(st%4?1:0));
  if(L===3||(L===2&&bar>=4)){const n=MELS[MU.song][bar][st];if(n)lead(t,n.m,n.len*sd)}
}
// ---- sfx
function sfx(name,a=1){const c=AU.ctx;if(!c||c.state!=='running'||SET.sfx<=0)return;const t=c.currentTime,D=AU.sfx;
  switch(name){
   case'clack':nz(t,.025,D,.25*a,'highpass',2400);osc('sine',95,t,.05,D,.3*a,60);break;
   case'chain':nz(t,.02,D,.3,'bandpass',3200,3);osc('square',1400,t,.015,D,.04);break;
   case'jump':osc('square',220,t,.14,D,.12,520);nz(t,.18,D,.2,'bandpass',900,1,2500);break;
   case'hop':osc('square',300,t,.1,D,.1,700);nz(t,.1,D,.15,'bandpass',1400,1,3000);break;
   case'land':osc('sine',140,t,.18,D,.6*a,45);nz(t,.1,D,.35*a,'lowpass',900);nz(t,.05,D,.2*a,'highpass',3500);break;
   case'gem':{const f=1320*Math.pow(2,((S.gemChain||0)%8)/12);osc('square',f,t,.07,D,.07);osc('square',f*1.5,t+.05,.1,D,.06);break}
   case'token':[0,4,7,12,16].forEach((s,i)=>osc('square',660*Math.pow(2,s/12),t+i*.06,.18,D,.08));break;
   case'letter':[0,7,12,19,24].forEach((s,i)=>osc('triangle',523*Math.pow(2,s/12),t+i*.05,.25,D,.12));break;
   case'power':[0,4,7,11,14,19].forEach((s,i)=>osc('square',440*Math.pow(2,s/12),t+i*.045,.16,D,.07));nz(t,.4,D,.1,'highpass',6000);break;
   case'shield':[1500,2240,3100].forEach(f=>osc('triangle',f,t,.5,D,.12,f*.7));nz(t,.3,D,.4,'highpass',3000);break;
   case'crash':nz(t,1.2,D,.9,'lowpass',2500,1,120);osc('sine',90,t,.6,D,.9,30);[523,777,1234,1567].forEach(f=>osc('triangle',f,t,.5,D,.07,f*.8));break;
   case'fall':osc('sine',900,t,1.2,D,.15,120);break;
   case'boost':osc('sawtooth',180,t,.45,D,.14,1400);nz(t,.5,D,.3,'bandpass',600,1,4000);break;
   case'stomp':osc('square',520,t,.12,D,.18,90);nz(t,.06,D,.3,'lowpass',1200);break;
   case'thud':osc('sine',70,t,.3,D,.7*a,35);nz(t,.15,D,.4*a,'lowpass',500);break;
   case'boom':nz(t,.8,D,.8*a,'lowpass',1200,1,80);osc('sine',60,t,.6,D,.8*a,25);break;
   case'whistle':osc('sine',1800,t,.95,D,.08,300);break;
   case'thunder':nz(t+.15,2.2,D,.9,'lowpass',400,1,60);break;
   case'geyser':nz(t,.7,D,.3,'bandpass',700,1,2400);break;
   case'whoosh':nz(t,.3,D,.35,'bandpass',500,2,3000);break;
   case'alarm':osc('square',880,t,.1,D,.06);osc('square',660,t+.12,.1,D,.06);break;

      if(!inR&&rs>=0){drawGround(g,T,rs,i-1,bot);rs=-1;if(i<=r[1]&&!P[i].loop)rs=i}else if(inR&&rs<0)rs=i}}

  $('lapH').textContent=trf('VUELTA {0} COMPLETADA',S.lap+1);
  $('lapStats').innerHTML=`<div>${tr('TIEMPO')}<span>${fmtT(S.lapTime)}</span></div><div>${tr('GEMAS')}<span>${S.lapGems}</span></div><div>${tr('FICHAS DE ORO')}<span>${S.lapTok}</span></div><div>${tr('DESCARRILES')}<span>${S.lapDeaths}</span></div><div>${tr('BONUS DE TIEMPO')}<span>+${tb}</span></div>${kb?`<div>${tr('VUELTA LIMPIA')}<span class="new">+${kb}</span></div>`:''}<div>${tr('PUNTOS')}<span>${S.score}</span></div>`;
  const nl=S.lap+1,nm=nl%3;$('lapChange').textContent=nl%3===0?trf('¡REMIX {0}! MÁS RÁPIDO · MÁS PELIGROS',Math.floor(nl/3)):tr('EL MUNDO CAMBIA…');
  $('lapMoods').innerHTML=BIOMES.map((B,i)=>`<div style="border-color:${B.acc};color:${B.acc};animation-delay:${.3+i*.16}s">${tr(B.name)}<b>${tr(B.moods[nm].n)}</b></div>`).join('');
  setTimeout(()=>{if(S.mode==='lapend')uiOpen('scrLap',0)},1200)}
function soloEnd(){sfx('lap');const key=S.world+'_'+S.mood,t=S.runT;let rows=`<div>${tr('TIEMPO')}<span>${fmtT(t)}</span></div><div>${tr('GEMAS')}<span>${S.gems}</span></div><div>${tr('DESCARRILES')}<span>${S.deaths}</span></div>`;
  if(S.gm==='trial'){const m=medalFor(t),prev=SAVE.times[key],nb=!prev||t<prev.t,par=CRS.par;
    rows+=`<div>${tr('MEDALLA')}<span>${m>=0?tr(MEDAL_NAME[m])+' '+medalHTML(m):tr('SIN MEDALLA')}</span></div><div>${tr('ORO')}<span>${fmtT(par*1.04)}</span></div><div>${tr('PLATA / BRONCE')}<span>${fmtT(par*1.2)} / ${fmtT(par*1.4)}</span></div>`;
    if(S.ghost2){const w=t<S.ghost2.t;rows+=`<div>${trf('FANTASMA DE {0}',S.ghost2.name)}<span class="${w?'new':''}">${fmtT(S.ghost2.t)}${w?' · '+tr('¡GANADO!'):''}</span></div>`}
    const bm=prev?bestMedal(prev.m,m):m;if(m===0&&!(prev&&prev.m===0))SAVE.golds++;
    if(nb){SAVE.times[key]={t,m:bm};if(S.rec)lsSet('rail.g.'+key,{t,d:S.rec.d});rows+=`<div class="new">${tr('¡NUEVO RÉCORD! FANTASMA GUARDADO')}<span></span></div>`}else prev.m=bm;
    if(prev&&!nb)rows+=`<div>${tr('TU RÉCORD')}<span>${fmtT(prev.t)}</span></div>`}
  saveNow();checkUnlocks();$('resH').textContent=S.gm==='trial'?tr('CONTRARRELOJ'):tr('MUNDO SUPERADO');$('resStats').innerHTML=rows;setTimeout(()=>{if(S.mode==='result')uiOpen('scrRes',0)},1000)}
function dailyEnd(){sfx('lap');const d=S.daily,prev=SAVE.daily[d.key]||0,nb=S.score>prev;if(nb)SAVE.daily[d.key]=S.score;saveNow();
  $('resH').textContent=tr('RETO DIARIO SUPERADO');$('resStats').innerHTML=`<div>${tr('PUNTOS')}<span>${S.score}</span></div><div>${tr('TIEMPO')}<span>${fmtT(S.runT)}</span></div><div>${tr('DESCARRILES')}<span>${S.deaths}</span></div><div>${tr('MEJOR DE HOY')}<span class="${nb?'new':''}">${Math.max(prev,S.score)}${nb?' '+tr('¡NUEVO!'):''}</span></div>`;setTimeout(()=>{if(S.mode==='result')uiOpen('scrRes',0)},1000)}
function raceEnd(){const[a,b]=CARTS;const aw=!!a.fin&&(!b.fin||a.fin<=b.fin);sfx('unlock');
  $('resH').textContent=trf('¡GANA {0}!',aw?tr('JUGADOR 1'):tr('JUGADOR 2'));
  $('resStats').innerHTML=`<div>${tr('JUGADOR 1')} · ${tr(a.ch.name)}<span class="${aw?'new':''}">${a.fin?fmtT(a.fin):'--'}</span></div><div>${tr('JUGADOR 2')} · ${tr(b.ch.name)}<span class="${aw?'':'new'}">${b.fin?fmtT(b.fin):'--'}</span></div><div>${tr('GEMAS')} J1 / J2<span>${a.gems} / ${b.gems}</span></div>`;
  saveNow();setTimeout(()=>{if(S.mode==='result')uiOpen('scrRes',0)},1400)}
function overScreen(){const di=DIFFS.indexOf(S.diff);let nb=false;if(S.gm==='laps'&&S.score>SAVE.best[di]){SAVE.best[di]=S.score;nb=true}if(S.gm==='daily'){const d=S.daily;if(S.score>(SAVE.daily[d.key]||0))SAVE.daily[d.key]=S.score}saveNow();checkUnlocks();
  $('overH').textContent=S.gm==='daily'?tr('RETO FALLIDO'):tr('FIN DEL TRAYECTO');
  $('overStats').innerHTML=`<div>${tr('PUNTOS')}<span>${S.score}</span></div><div>${tr('VUELTA')}<span>${S.lap+1}</span></div><div>${tr('GEMAS')}<span>${S.gems}</span></div>`+(S.gm==='laps'?`<div>${tr('RÉCORD')} ${tr(S.diff.name)}<span class="${nb?'new':''}">${SAVE.best[di]}${nb?' '+tr('¡NUEVO!'):''}</span></div>`:'');
  S.canCont=S.gm==='laps'&&S.diff.cont;S.contT=10;setTimeout(()=>{if(S.mode==='over')uiOpen('scrOver',0)},900)}

// ==================== input.js
// Input: keyboard (1P or split 2P), touch (buttons or screen halves + swipe), gamepads (standard mapping, one per player in races) and rumble.
const KEYS={jump:['Space','ArrowUp','KeyW','KeyZ','KeyK'],brake:['ArrowDown','KeyS','KeyX','ShiftLeft','ShiftRight','KeyJ'],sw:['KeyE','KeyQ','KeyC','ArrowRight','ArrowLeft','KeyL']};
const KEYS2P=[{jump:['KeyW','Space'],brake:['KeyS'],sw:['KeyD','KeyA','KeyE']},{jump:['ArrowUp','Numpad8','Enter'],brake:['ArrowDown','Numpad5'],sw:['ArrowLeft','ArrowRight','Numpad4','Numpad6']}];
const PREVENT=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab']);
const held={};
const racing=()=>S.gm==='race'&&CARTS.length>1;
function menuKey(c,rep){const sc=SCREENS[UI.cur],hz=sc&&sc.axis==='h';
  if(c==='ArrowUp'||c==='KeyW'){if(!hz)uiMove(-1);else uiVert(-1)}
  else if(c==='ArrowDown'||c==='KeyS'){if(!hz)uiMove(1);else uiVert(1)}
  else if(c==='ArrowLeft'||c==='KeyA'){hz?uiMove(-1):uiAdj(-1)}
  else if(c==='ArrowRight'||c==='KeyD'){hz?uiMove(1):uiAdj(1)}
  else if(!rep&&(c==='Enter'||c==='Space'||c==='KeyZ'||c==='KeyK'))uiOk();
  else if(!rep&&(c==='Escape'||c==='Backspace'||c==='KeyX'))uiBack()}
addEventListener('keydown',e=>{const c=e.code;const tgt=e.target;if(tgt&&(tgt.tagName==='TEXTAREA'||tgt.tagName==='INPUT')){if(c==='Escape'){tgt.blur();uiBack()}return}
  if(PREVENT.has(c))e.preventDefault();auInit();
  if(UI.cur){menuKey(c,e.repeat);return}
  if(e.repeat)return;held[c]=1;
  if(S.mode==='play'&&!S.paused){
    if(racing()){KEYS2P.forEach((K,k)=>{const I=CARTS[k].in;if(K.jump.includes(c))I.jumpHit=true;if(K.sw.includes(c))I.swHit=true});if(c==='Escape'||c==='KeyP')openPause()}
    else{const I=P1.in;if(KEYS.jump.includes(c))I.jumpHit=true;if(KEYS.sw.includes(c))I.swHit=true;
      if(c==='Escape'||c==='KeyP'||c==='Enter')openPause();
      if(c==='KeyR'&&(S.gm==='practice'||S.gm==='trial'))beginSolo(S.world,S.mood,S.gm,S.ghost2)}}
  if(c==='KeyM'){SET.mus=SET.mus?0:7;saveSet();popTxt(SET.mus?tr('MÚSICA ON'):tr('MÚSICA OFF'),'#fff')}
  if(c==='KeyB'&&e.shiftKey&&S.gm!=='attract'){S.bot=!S.bot;popTxt(S.bot?tr('PILOTO AUTOMÁTICO'):tr('MANUAL'),'#39e6ff')}});
addEventListener('keyup',e=>{held[e.code]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0});
// ---- touch (single player)
const TP={j:0,b:0};const PTR={};
const wrapEl=$('wrap');
function tbDown(id,e){e.preventDefault();e.stopPropagation();auInit();const el=e.currentTarget;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(id==='j'){TP.j++;P1.in.jumpHit=true}else if(id==='b')TP.b++;else if(id==='s')P1.in.swHit=true;else if(id==='p')openPause()}
function tbUp(id,e){const el=e.currentTarget;el.classList.remove('on');if(id==='j')TP.j=Math.max(0,TP.j-1);else if(id==='b')TP.b=Math.max(0,TP.b-1)}
for(const[id,el]of[['j','tbJ'],['b','tbB'],['s','tbS'],['p','tbP']]){const d=$(el);d.addEventListener('pointerdown',e=>tbDown(id,e));d.addEventListener('pointerup',e=>tbUp(id,e));d.addEventListener('pointercancel',e=>tbUp(id,e))}
wrapEl.addEventListener('pointerdown',e=>{auInit();if(UI.cur||S.mode!=='play'||S.paused||racing())return;if(e.target.closest('.tb'))return;
  const r=wrapEl.getBoundingClientRect(),side=(e.clientX-r.left)<r.width*.4?'b':'j';PTR[e.pointerId]={side,y:e.clientY,t:performance.now(),sw:false};
  if(side==='j'){TP.j++;P1.in.jumpHit=true}else TP.b++;try{wrapEl.setPointerCapture(e.pointerId)}catch(_){}});
wrapEl.addEventListener('pointermove',e=>{const p=PTR[e.pointerId];if(!p||p.sw)return;if(Math.abs(e.clientY-p.y)>wrapEl.clientHeight*.08&&performance.now()-p.t<400){p.sw=true;P1.in.swHit=true}});
const ptrUp=e=>{const p=PTR[e.pointerId];if(!p)return;if(p.side==='j')TP.j=Math.max(0,TP.j-1);else TP.b=Math.max(0,TP.b-1);delete PTR[e.pointerId]};
wrapEl.addEventListener('pointerup',ptrUp);wrapEl.addEventListener('pointercancel',ptrUp);
// ---- gamepads
const GP={pad:null,pads:[],prev:{},dir:'',rep:0,warned:false,st:[{jump:0,brake:0},{jump:0,brake:0}]};
function getPads(){let pads;try{pads=navigator.getGamepads?navigator.getGamepads():[]}catch(e){return[]}return[...(pads||[])].filter(p=>p&&p.connected)}
function rumble(ms,strong=.6,weak=.4,who=0){const p=GP.pads[who]||(who===0?GP.pad:null);if(!SET.vib||!p||!p.vibrationActuator)return;try{const r=p.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function padWake(){auInit();if(AU.ctx&&AU.ctx.state!=='running'&&!GP.warned){GP.warned=true;setTimeout(()=>{if(AU.ctx&&AU.ctx.state!=='running')popTxt(tr('HAZ CLIC PARA ACTIVAR EL SONIDO'),'#fff')},400)}}
function padFrame(dt){const pads=getPads();GP.pads=pads;GP.pad=pads[0]||null;GP.st[0].jump=GP.st[0].brake=GP.st[1].jump=GP.st[1].brake=0;if(!pads.length)return;
  let menuDir='',ok=false,back=false;
  pads.forEach((p,pi)=>{const prev=GP.prev[p.index]||(GP.prev[p.index]=[]);
    const b=i=>{const x=p.buttons[i];return!!x&&(x.pressed||x.value>.4)};const edge=i=>b(i)&&!prev[i];
    const ax=p.axes[0]||0,ay=p.axes[1]||0;const up=b(12)||ay<-.6,dn=b(13)||ay>.6,lf=b(14)||ax<-.6,rt=b(15)||ax>.6;
    if(UI.cur){const d=up?'u':dn?'d':lf?'l':rt?'r':'';if(d&&!menuDir)menuDir=d;if(edge(0)||edge(9)){padWake();ok=true}if(edge(1))back=true}
    else if(S.mode==='play'&&!S.paused){const who=racing()?Math.min(pi,1):0,I=CARTS[who].in;
      if(edge(0)||edge(12)){padWake();I.jumpHit=true}
      if(edge(3)||edge(4)||edge(5)||edge(14)||edge(15))I.swHit=true;
      if(edge(9))openPause();
      if(edge(8)){SET.mus=SET.mus?0:7;saveSet();popTxt(SET.mus?tr('MÚSICA ON'):tr('MÚSICA OFF'),'#fff')}
      GP.st[who].jump|=b(0)||up;GP.st[who].brake|=b(1)||b(2)||b(6)||b(7)||dn}
    for(let i=0;i<p.buttons.length;i++)prev[i]=b(i)});
  if(UI.cur){const sc=SCREENS[UI.cur],hz=sc&&sc.axis==='h';const nav=d=>{if(d==='u')hz?uiVert(-1):uiMove(-1);if(d==='d')hz?uiVert(1):uiMove(1);if(d==='l')hz?uiMove(-1):uiAdj(-1);if(d==='r')hz?uiMove(1):uiAdj(1)};
    if(menuDir){if(menuDir!==GP.dir){GP.dir=menuDir;GP.rep=.35;nav(menuDir)}else{GP.rep-=dt;if(GP.rep<=0){GP.rep=.12;nav(menuDir)}}}else GP.dir='';
    if(ok)uiOk();else if(back)uiBack()}}
addEventListener('gamepadconnected',e=>popTxt(trf('MANDO {0} CONECTADO',getPads().length),'#39e6ff'));
addEventListener('gamepaddisconnected',()=>{popTxt(tr('MANDO DESCONECTADO'),'#ff3b5c');if(S.mode==='play'&&!S.paused)openPause()});
function readInput(){
  if(racing()){KEYS2P.forEach((K,k)=>{const I=CARTS[k].in;I.jump=K.jump.some(c=>held[c])||!!GP.st[k].jump;I.brake=K.brake.some(c=>held[c])||!!GP.st[k].brake});return}
  const I=P1.in;I.jump=KEYS.jump.some(k=>held[k])||TP.j>0||!!GP.st[0].jump;I.brake=KEYS.brake.some(k=>held[k])||TP.b>0||!!GP.st[0].brake}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play'&&!S.paused)openPause();if(!document.hidden&&AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume()});

// ==================== main.js
// Main loop (multi-cart) and boot.
let last=performance.now();
function tick(dt){
  S.T+=dt;
  padFrame(dt);readInput();uiFrame(dt);
  if(S.paused){audioFrame();hud();return}
  const auto=S.gm==='attract'||S.bot;
  if(auto&&(S.mode==='play'||S.mode==='menu'))for(const c of CARTS){useCart(c);const b=botInput(dt);IN.jump=b.jump;IN.brake=b.brake;if(b.jumpHit)IN.jumpHit=true;if(b.swHit)IN.swHit=true}
  useCart(P1);
  S.flash=Math.max(0,S.flash-dt*3);
  const active=S.mode==='play'||S.mode==='menu'||S.mode==='lapend'||S.mode==='result';
  if(active){
    let ts=1;if(S.slowT>0){S.slowT-=dt;ts=CARTS.length>1?1:S.slowA}
    const h=dt*ts;
    if(S.countT>0){const n0=Math.ceil(S.countT);S.countT-=dt;const n1=Math.ceil(S.countT);if(n1!==n0){sfx(n1>0?'beep':'horn');if(n1<=0)rumble(200,.5,.5,0),rumble(200,.5,.5,1)}
      for(const c of CARTS){c.in.jumpHit=false;c.in.swHit=false}}
    else{
      near();
      // entity AI reacts to the leading cart (P1 alone in single player)
      let lead=P1;for(const c of CARTS)if(!c.dead&&!c.fin&&(lead.dead||lead.fin||c.x>lead.x))lead=c;
      useCart(lead);updEntities(h);
      const n=Math.max(1,Math.ceil(h/.004)),gt0=S.gt;
      for(const c of CARTS){useCart(c);
        if(c.fin){c.v=Math.max(0,c.v-400*h);continue}
        if(c.dead){updDead(h);continue}
        for(let k=0;k<n;k++){S.gt=gt0+h*(k+1)/n;step(h/n);if(C.dead||C.fin||!CARTS.includes(C))break}}
      S.gt=gt0+h;
      if(!CARTS.includes(C))useCart(P1);
      if(S.bonus&&S.gt-S.bonus.t0>S.bonus.dur){useCart(P1);exitBonus()}
      if(S.mode==='play'){S.lapTime+=dt;S.runT+=dt;useCart(P1);recGhost(dt)}}
    useCart(P1);
    let gi=Math.min(S.gemIdx,GEMS.length);while(gi<GEMS.length&&GEMS[gi].x<C.x-40)gi++;while(gi>0&&GEMS[gi-1].x>C.x-40)gi--;S.gemIdx=gi;
    updParts(h);
    const bi=(C.T.P[C.i]||{}).bi||0,M=moodOf(bi);
    if(M.storm){S.lightT-=dt;if(S.lightT<=0){S.lightT=3+Math.random()*5;S.lightF=SET.flash?1:.45;S.boltX=.2+Math.random()*.6;S.boltSeed=Math.random()*1e6|0;sfx('thunder')}}
    S.lightF=Math.max(0,S.lightF-dt*(S.lightF>.5?2:4));
    if(M.rumble){S.rumbleT-=dt;if(S.rumbleT<=0){S.rumbleT=4+Math.random()*5;S.shake=Math.max(S.shake,4);rumble(300,.4,.2)}}
    for(const c of CARTS){useCart(c);trailFx(dt);computeWarnings()}
  }
  S.shake=Math.max(0,S.shake-dt*14);S.zpunch*=Math.pow(.02,dt);if(Math.abs(S.zpunch)<.01)S.zpunch=0;
  const split=CARTS.length>1;
  for(const c of CARTS){useCart(c);updCam(dt,split?.72:1)}
  useCart(P1);
  const z=cam.z,vw=VW/z,vh=VH/z*(split?.5:1);updWx(dt,cam.x-vw/2,cam.y-vh/2,vw,vh);
  audioFrame();hud();
  if(saveTimer>0){saveTimer-=dt;if(saveTimer<=0)saveNow()}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);render();requestAnimationFrame(frame)}
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('wrap'));
resize();applyI18nDom();
toTitle();
requestAnimationFrame(frame);
window.__rs={S,P1,P2,CARTS,cam:()=>cam,E,GEMS,TR,FORKS,CRS,SAVE,SET,DYN,BONUS,WATERZ,DARKZ,encodeGhost,decodeGhost,
  step:(n=60,dt=1/60)=>{for(let k=0;k<n;k++)tick(dt)},render,startRun,beginLaps,beginSolo,beginDaily,beginRace,toTitle,uiOpen,closeUI,placeAt,respawn,useCart,enterBonus,
  get C(){return C},get MAIN(){return MAIN},get NEAR(){return NEAR},get UI(){return UI}};

</script>
