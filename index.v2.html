<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07050c;--fg:#fff4e0;--dim:rgba(255,244,224,.62);--faint:rgba(255,244,224,.35);--acc:#ffcf3a;--accd:#8a5a00;--hot:#ff3b5c;--cool:#39e6ff;--good:#6cff5a;--panel:rgba(14,8,26,.9);--ink:#1a0610}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
#wrap{position:relative;width:min(100vw,177.78vh);max-width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;container-type:inline-size}
#c{width:100%;height:100%;display:block;image-rendering:pixelated}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;mix-blend-mode:screen}
/* ---------- HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-size:1.2cqw;text-shadow:0 .25cqw 0 #000,0 0 .8cqw rgba(0,0,0,.7);transition:opacity .4s}
.hud.off{opacity:0}
.tl{position:absolute;left:2cqw;top:1.8cqw;line-height:1.7}
#hMode{color:#fff}
#hMood{font-size:.8cqw;color:#ffd98a}
#hLet{display:flex;gap:.45cqw;margin-top:.5cqw}
#hLet i{font-style:normal;font-size:.85cqw;width:1.8cqw;height:1.8cqw;display:grid;place-items:center;border:.2cqw solid rgba(255,207,58,.35);color:rgba(255,207,58,.4);background:rgba(0,0,0,.35);text-shadow:none}
#hLet i.on{border-color:var(--acc);color:var(--ink);background:var(--acc);box-shadow:0 0 .8cqw var(--acc)}
.tc{position:absolute;left:50%;top:1.8cqw;transform:translateX(-50%);display:flex;gap:2.2cqw;align-items:center;font-variant-numeric:tabular-nums}
.gem{display:inline-block;width:1.05cqw;height:1.05cqw;background:linear-gradient(135deg,#bff,#39e6ff 50%,#1a7ab0);transform:rotate(45deg);margin-right:.8cqw;box-shadow:0 0 .8cqw #39e6ff}
.tok{display:inline-block;width:1.15cqw;height:1.15cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#ffc21a 50%,#b06a00);margin-right:.6cqw;box-shadow:0 0 .8cqw #ffc21a}
.tr{position:absolute;right:2cqw;top:1.8cqw;text-align:right;line-height:1.7}
#hLives{min-height:1.2cqw}
#hLives i{display:inline-block;width:1.45cqw;height:1cqw;margin-left:.45cqw;background:#ffc93c;border-radius:1cqw 1cqw .15cqw .15cqw;box-shadow:inset -.25cqw -.2cqw 0 #c8821a,0 0 .5cqw rgba(255,200,60,.6)}
#hPow{display:flex;gap:.5cqw;justify-content:flex-end;margin-top:.3cqw;font-size:.75cqw}
#hPow span{padding:.3cqw .5cqw;border:.2cqw solid;background:rgba(0,0,0,.45)}
.br{position:absolute;right:2cqw;bottom:2cqw;text-align:right;font-variant-numeric:tabular-nums}
#hKmh{font-size:2.8cqw;color:#fff}
#spd small{font-size:.85cqw;color:#ffd98a}
.bar{width:15cqw;height:.85cqw;background:rgba(0,0,0,.5);border:.2cqw solid var(--fg);margin-top:.7cqw;margin-left:auto}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39e6ff,#ffcf3a 60%,#ff3b5c)}
.bl{position:absolute;left:2cqw;bottom:2cqw;font-size:.75cqw;color:rgba(255,244,224,.7);line-height:1.9;transition:opacity 1s}
.bl b{color:#fff;font-weight:normal}
#strain{position:absolute;left:50%;bottom:6.5cqw;transform:translateX(-50%);width:22cqw;height:1.1cqw;border:.2cqw solid #fff;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
#strain i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf3a,#ff3b5c)}
#strain b{position:absolute;left:0;right:0;top:-2cqw;text-align:center;font-size:1cqw;color:#ff6a7a;font-weight:normal}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0}
#banner .b1{font-size:4cqw;letter-spacing:.2cqw;text-shadow:0 .4cqw 0 #000,0 0 2cqw currentColor}
#banner .b2{font-size:1.3cqw;margin-top:1.4cqw;color:#fff4e0;text-shadow:0 .25cqw 0 #000}
#banner.show{animation:ban 3.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-2cqw)}}
#pop{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:2.1cqw;pointer-events:none;opacity:0;text-shadow:0 .3cqw 0 #000}
#pop.show{animation:pop 1.4s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#prompt{position:absolute;left:0;right:0;top:66%;text-align:center;font-size:2.4cqw;pointer-events:none;opacity:0;text-shadow:0 .3cqw 0 #000,0 0 1.4cqw currentColor}
#prompt.show{animation:prm .95s ease forwards}
@keyframes prm{0%{opacity:0;transform:scale(1.7)}14%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(.92)}}
/* ---------- screens */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-inline:3cqw;background:radial-gradient(ellipse at center,rgba(8,4,16,.72),rgba(8,4,16,.93));transition:opacity .25s}
.ov.hidden{opacity:0;pointer-events:none;visibility:hidden}
#scrTitle{background:linear-gradient(90deg,rgba(8,4,16,.78) 0%,rgba(8,4,16,.45) 45%,rgba(8,4,16,0) 75%);align-items:flex-start;text-align:left;padding-left:6cqw}
.logo{font-size:5.8cqw;line-height:1.1;background:linear-gradient(180deg,#fff6c0 0%,#ffcf3a 45%,#ff6a2a 70%,#c01a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5cqw 0 var(--ink)) drop-shadow(0 0 2cqw rgba(255,120,40,.45));transform:rotate(-3deg);transform-origin:left}
.sub{margin-top:1.6cqw;font-size:1cqw;color:var(--cool);letter-spacing:.2cqw;text-shadow:0 0 1cqw var(--cool)}
h2{font-size:2.6cqw;color:var(--acc);text-shadow:0 .4cqw 0 #000;margin-bottom:1.6cqw;font-weight:normal}
.list{display:flex;flex-direction:column;gap:.55cqw;margin-top:2cqw;width:min(42cqw,100%)}
.list.wide{width:min(64cqw,100%)}
.list.row{flex-direction:row;justify-content:center;width:auto;gap:1.2cqw}
.mi{font:inherit;font-size:1.15cqw;color:var(--fg);background:rgba(255,244,224,.05);border:0;border-left:.35cqw solid transparent;padding:.75cqw 1.3cqw;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:2cqw;letter-spacing:.05cqw;line-height:1.5}
.mi .v{color:var(--acc);white-space:nowrap}
.mi small{display:block;font-size:.7cqw;color:var(--dim);margin-top:.35cqw}
.mi.sel{color:var(--ink);background:var(--acc);border-left-color:#fff;box-shadow:0 .3cqw 0 var(--accd)}
.mi.sel .v,.mi.sel small{color:var(--ink)}
.mi.locked{color:var(--faint)}
.mi.locked.sel{background:rgba(255,207,58,.35);color:var(--ink)}
.mi:focus-visible{outline:.2cqw solid var(--cool)}
.desc{margin-top:1.6cqw;font-size:.85cqw;line-height:1.9;color:var(--dim);min-height:3.4cqw;max-width:60cqw}
.desc b{color:var(--fg);font-weight:normal}
.hint{position:absolute;bottom:2cqw;left:0;right:0;text-align:center;font-size:.72cqw;color:var(--dim);line-height:1.8}
.best{margin-top:1.4cqw;font-size:.8cqw;color:var(--dim)}
.cards{display:flex;gap:1.4cqw;margin-top:1cqw;flex-wrap:wrap;justify-content:center}
.card{width:16cqw;padding:1.1cqw .8cqw;border:.25cqw solid rgba(255,244,224,.22);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:.8cqw;cursor:pointer}
.card canvas{width:12cqw;height:12cqw;image-rendering:pixelated}
.card.sel{border-color:var(--acc);box-shadow:0 0 1.4cqw rgba(255,207,58,.45)}
.card.cur b::after{content:' ✓';color:var(--good)}
.card b{font-weight:normal;font-size:1cqw}
.card small{font-size:.65cqw;color:var(--dim);line-height:1.7;min-height:2.2cqw}
.card.locked canvas{filter:brightness(0) drop-shadow(0 0 .3cqw rgba(255,255,255,.4))}
.stats{font-size:1.05cqw;line-height:2.2;text-align:left;width:min(40cqw,100%);font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;gap:3cqw}
.stats span{color:#ffd98a}
.stats .new{color:var(--good)}
.stats.two{width:min(64cqw,100%);columns:2;column-gap:4cqw}
.stats.two div{break-inside:avoid}
.medal{display:inline-block;width:1cqw;height:1cqw;border-radius:50%;vertical-align:-.1cqw;margin-left:.4cqw}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:.9cqw;margin-top:2cqw}
.moods div{border:.2cqw solid;padding:.9cqw .5cqw;font-size:.72cqw;line-height:1.8;background:rgba(0,0,0,.45);opacity:0;transform:translateY(1cqw);animation:mIn .5s ease forwards}
.moods b{display:block;font-weight:normal;font-size:.9cqw;color:#fff}
@keyframes mIn{to{opacity:1;transform:none}}
.change{margin-top:2cqw;font-size:1.4cqw;color:var(--hot);text-shadow:0 0 1.2cqw var(--hot)}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
/* ---------- touch */
.touch{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:.3cqw solid rgba(255,255,255,.4);background:rgba(10,6,20,.3);display:grid;place-items:center;font-size:.95cqw;color:rgba(255,255,255,.85);touch-action:none}
.tb.on{background:rgba(255,207,58,.45);border-color:#fff}
#tbB{left:3cqw;bottom:3cqw;width:13cqw;height:13cqw}
#tbJ{right:3cqw;bottom:3cqw;width:14cqw;height:14cqw}
#tbS{right:19cqw;bottom:3.5cqw;width:9.5cqw;height:9.5cqw;color:var(--acc)}
#tbP{left:2cqw;top:10.5cqw;width:5.5cqw;height:5.5cqw;border-radius:1cqw;font-size:1.2cqw}
#wrap.touchon .br{bottom:auto;top:9.5cqw}
#wrap.touchon #hPow{margin-bottom:.5cqw}
@media (prefers-reduced-motion:reduce){#banner.show,#pop.show,#prompt.show{animation-duration:.01s;opacity:1}.blink{animation:none}}
</style>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="vig"></div><div id="flash"></div>
  <div class="hud off" id="hud">
    <div class="tl"><div id="hMode">VUELTA 1</div><div id="hMood"></div><div id="hLet"><i>R</i><i>A</i><i>I</i><i>L</i></div></div>
    <div class="tc"><div><span class="gem"></span><span id="hGems">0</span></div><div><span class="tok"></span><span id="hTok">0</span></div><div id="hScore">000000</div></div>
    <div class="tr"><div id="hLives"></div><div id="hTime">0:00.0</div><div id="hPow"></div></div>
    <div class="br"><div id="spd"><span id="hKmh">0</span> <small>KM/H</small><div class="bar"><i id="hBar"></i></div></div></div>
    <div class="bl" id="hKeys"><b>ESPACIO</b> saltar · <b>S</b> frenar · <b>E</b> cambiar vía · <b>ESC</b> pausa</div>

  </div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>

  <div id="prompt"></div>
  <div class="touch" id="touch" hidden>

  </div>
  <div class="ov" id="scrTitle">
    <div class="logo">RAÍL<br>SALVAJE</div>

  <div class="ov hidden" id="scrOpts"><h2>OPCIONES</h2><div class="list wide" id="lOpts"></div><div class="desc" id="dOpts"></div></div>
  <div class="ov hidden" id="scrRecs"><h2>RÉCORDS</h2><div class="stats two" id="recStats"></div><div class="list" id="lRecs"></div></div>
  <div class="ov hidden" id="scrDaily"><h2>RETO DIARIO</h2><div class="stats" id="dailyInfo"></div><div class="list" id="lDaily"></div><div class="desc" id="dDaily"></div></div>
  <div class="ov hidden" id="scrPause"><h2>PAUSA</h2><div class="list" id="lPause"></div></div>
  <div class="ov hidden" id="scrLap"><h2 id="lapH"></h2><div class="stats" id="lapStats"></div><div class="change" id="lapChange"></div><div class="moods" id="lapMoods"></div><div class="list" id="lLap"></div></div>
  <div class="ov hidden" id="scrOver"><h2 id="overH">FIN DEL TRAYECTO</h2><div class="stats" id="overStats"></div><div class="list" id="lOver"></div></div>
  <div class="ov hidden" id="scrRes"><h2 id="resH"></h2><div class="stats" id="resStats"></div><div class="list" id="lRes"></div></div>
</div>
<script>
// ==================== core.js
'use strict';
// Utilities, pixel drawing primitives, canvases and global constants.
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ss=t=>t*t*(3-2*t);
const TAU=Math.PI*2;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(n){n=Math.imul((n|0)^0x27d4eb2d,0x9E3779B1);n^=n>>>15;n=Math.imul(n,0x85ebca6b);n^=n>>>13;return(n>>>0)/4294967296}
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function shade(h,f){const c=h2r(h),t=f<0?0:255,p=Math.abs(f);return r2h(...c.map(v=>v+(t-v)*p))}
function mixc(a,b,t){const x=h2r(a),y=h2r(b);return r2h(...x.map((v,i)=>v+(y[i]-v)*t))}
function rgba(h,a){const c=h2r(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function wrapA(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}
function pline(g,x0,y0,x1,y1,w=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let n=0;n<1200;n++){g.fillRect(x0,y0,w,w);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function pcirc(g,cx,cy,r){r=Math.round(r);for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(r*r-dy*dy));g.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2,1)}}
function pring(g,cx,cy,r){cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);let x=r,y=0,e=1-r;while(x>=y){g.fillRect(cx+x,cy+y,1,1);g.fillRect(cx+y,cy+x,1,1);g.fillRect(cx-y,cy+x,1,1);g.fillRect(cx-x,cy+y,1,1);g.fillRect(cx-x,cy-y,1,1);g.fillRect(cx-y,cy-x,1,1);g.fillRect(cx+y,cy-x,1,1);g.fillRect(cx+x,cy-y,1,1);y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1}}}
function pell(g,cx,cy,rx,ry){ry=Math.max(1,Math.round(ry));for(let dy=-ry;dy<=ry;dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2,1)}}
function tri(g,x,y,w,h,dir){for(let r=0;r<h;r++){const ww=Math.max(1,Math.round(w*(1-r/h)));g.fillRect(Math.round(x-ww/2),Math.round(dir>0?y+r:y-r),ww,1)}}
// 3x5 pixel font for in-world signs
const FONT3={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111','F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'010101101101010','P':'110101110100100','Q':'010101101110011','R':'110101110101101','S':'011100010001110','T':'111010010010010','U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111',
'!':'010010010000010','?':'110001010000010','-':'000000111000000','+':'000010111010000','/':'001001010100100','.':'000000000000010',':':'000010000010000',' ':'000000000000000','Í':'010000010010010','Ó':'010000111101111','Á':'010000111101101','É':'010000111110111','Ñ':'111000110101101'};
function tiny(g,s,x,y){s=String(s).toUpperCase();for(let k=0;k<s.length;k++){const b=FONT3[s[k]];if(!b)continue;for(let j=0;j<15;j++)if(b[j]==='1')g.fillRect(x+k*4+j%3,y+(j/3|0),1,1)}}
const tinyW=s=>String(s).length*4-1;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function fmtT(t){if(!isFinite(t))return'--:--.-';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- screen & physics constants
const OW=960,OH=540,BASE=2.4,ZMIN=.62,ZMAX=1.6;
const BW=Math.ceil(OW/BASE/ZMIN)+8,BH=Math.ceil(OH/BASE/ZMIN)+8;
const G0=950,JUMPV=345,VMAX=640,BRAKE=560,KMH=.18;
const cv=$('c'),og=cv.getContext('2d');og.imageSmoothingEnabled=false;
const WC=mk(BW,BH),wg=WC.getContext('2d');wg.imageSmoothingEnabled=false;
const LC=mk(BW,BH),lg=LC.getContext('2d');
const TOUCH=matchMedia('(pointer:coarse)').matches;

// ==================== data.js
// Game data: worlds (biomes) with 3 moods, track sequences, difficulties, characters, daily modifiers.
// hz = hazard counts per world on the main route (scaled by difficulty / remix).
const BIOMES=[

const ARMS={ride:[[34,29],[31,29]],fast:[[36,28],[33,28]],brake:[[31,29],[29,29]],air:[[30,12],[22,11]],cheer:[[31,11],[19,11]]};
function composeRider(g,ch,pose,t,sp,wf,part='all'){
  g.clearRect(0,0,48,48);const B=ch.body;
  const lx=pose==='fast'?2:pose==='brake'?-2:0,hy=pose==='fast'?1:0;
  if(part!=='cart'){
    // trailing scarf / bandana
    if(ch.trail){g.fillStyle=ch.trail;for(let k=0;k<7;k++){const sx=20+lx-k*2.1*(.45+sp),sy=22+Math.sin(t*22+k*.9)*k*.42*(.3+sp)+k*(1-sp)*1.1;g.fillRect(Math.round(sx),Math.round(sy),2,2)}}
    // monkey tail
    if(ch.tail&&part==='all'){g.fillStyle=ch.tail;for(let k=0;k<9;k++){const a=k/8;g.fillRect(Math.round(11-k*1.2+Math.sin(t*5)*a*1.5),Math.round(33-k*1.9+Math.sin(t*6+k*.7)*a),2,2)}g.fillRect(3+Math.round(Math.sin(t*5)*1.5),16,2,2)}
    const arms=ARMS[pose==='hurt'?'air':pose]||ARMS.ride;
    const wav=pose==='cheer'?((t*8|0)%2)*2:0;
    // back arm
    g.fillStyle=shade(B.arm,-.3);pline(g,21+lx,24,arms[1][0]+(pose==='air'||pose==='cheer'?lx:0),arms[1][1]+(pose==='cheer'?2-wav:0),2);
    // torso
    g.fillStyle=B.b;g.fillRect(20+lx,23,8,7);g.fillStyle=B.B;g.fillRect(20+lx,27,8,3);g.fillStyle=shade(B.b,.25);g.fillRect(21+lx,23,2,2);
    g.drawImage(headSpr(ch),15+lx,13+hy);
    if(ch.antenna&&Math.sin(t*6)>0){g.fillStyle='#ff3b5c';g.fillRect(23+lx,13+hy,1,1)}
    var fa=arms[0];

function beginLaps(di){closeUI();S.paused=false;startRun('laps',{diff:di,lap:0});hudCache={}}
function beginSolo(bi,m,gm){closeUI();S.paused=false;startRun(gm,{world:bi,mood:m});hudCache={}}
function beginDaily(){closeUI();S.paused=false;const d=dailyInfo();startRun('daily',{mood:d.mood,mods:d.mods,daily:d});hudCache={};showBanner('RETO DIARIO',d.mods.map(m=>m.name).join(' + '),'#ff3cac')}
function openPause(sel=0){if(S.mode!=='play')return;S.paused=true;UI.fromPause=1;uiOpen('scrPause',sel)}
function resume(){S.paused=false;UI.fromPause=0;closeUI()}
function lapEnd(){sfx('lap');const tb=scorePts(Math.max(0,4000-S.lapTime*15)),kb=S.lapDeaths===0?scorePts(2000):0;
  SAVE.maxLap=Math.max(SAVE.maxLap,S.lap+1);const di=DIFFS.indexOf(S.diff);if(S.score>SAVE.best[di])SAVE.best[di]=S.score;saveNow();checkUnlocks();
  $('lapH').textContent='VUELTA '+(S.lap+1)+' COMPLETADA';
  $('lapStats').innerHTML=`<div>TIEMPO<span>${fmtT(S.lapTime)}</span></div><div>GEMAS<span>${S.lapGems}</span></div><div>FICHAS DE ORO<span>${S.lapTok}</span></div><div>DESCARRILES<span>${S.lapDeaths}</span></div><div>BONUS DE TIEMPO<span>+${tb}</span></div>${kb?`<div>VUELTA LIMPIA<span class="new">+${kb}</span></div>`:''}<div>PUNTOS<span>${S.score}</span></div>`;
  const nl=S.lap+1,nm=nl%3;$('lapChange').textContent=nl%3===0?'¡REMIX '+Math.floor(nl/3)+'! MÁS RÁPIDO · MÁS PELIGROS':'EL MUNDO CAMBIA…';
  $('lapMoods').innerHTML=BIOMES.map((B,i)=>`<div style="border-color:${B.acc};color:${B.acc};animation-delay:${.3+i*.16}s">${B.name}<b>${B.moods[nm].n}</b></div>`).join('');
  setTimeout(()=>{if(S.mode==='lapend')uiOpen('scrLap',0)},1200)}
function soloEnd(){sfx('lap');const key=S.world+'_'+S.mood,t=S.runT;let rows=`<div>TIEMPO<span>${fmtT(t)}</span></div><div>GEMAS<span>${S.gems}</span></div><div>DESCARRILES<span>${S.deaths}</span></div>`;
  if(S.gm==='trial'){const m=medalFor(t),prev=SAVE.times[key];const nb=!prev||t<prev.t;const par=CRS.par;
    rows+=`<div>MEDALLA<span>${m>=0?MEDAL_NAME[m]+' '+medalHTML(m):'SIN MEDALLA'}</span></div><div>ORO<span>${fmtT(par*1.04)}</span></div><div>PLATA / BRONCE<span>${fmtT(par*1.2)} / ${fmtT(par*1.4)}</span></div>`;
    const bm=prev?bestMedal(prev.m,m):m;if(m===0&&!(prev&&prev.m===0))SAVE.golds++;
    if(nb){SAVE.times[key]={t,m:bm};if(S.rec)lsSet('rail.g.'+key,{t,d:S.rec.d});rows+=`<div class="new">¡NUEVO RÉCORD! FANTASMA GUARDADO<span></span></div>`}else prev.m=bm;
    if(prev&&!nb)rows+=`<div>TU RÉCORD<span>${fmtT(prev.t)}</span></div>`}
  saveNow();checkUnlocks();$('resH').textContent=S.gm==='trial'?'CONTRARRELOJ':'MUNDO SUPERADO';$('resStats').innerHTML=rows;setTimeout(()=>{if(S.mode==='result')uiOpen('scrRes',0)},1000)}
function dailyEnd(){sfx('lap');const d=S.daily,prev=SAVE.daily[d.key]||0,nb=S.score>prev;if(nb)SAVE.daily[d.key]=S.score;saveNow();
  $('resH').textContent='RETO DIARIO SUPERADO';$('resStats').innerHTML=`<div>PUNTOS<span>${S.score}</span></div><div>TIEMPO<span>${fmtT(S.runT)}</span></div><div>DESCARRILES<span>${S.deaths}</span></div><div>MEJOR DE HOY<span class="${nb?'new':''}">${Math.max(prev,S.score)}${nb?' ¡NUEVO!':''}</span></div>`;setTimeout(()=>{if(S.mode==='result')uiOpen('scrRes',0)},1000)}
function overScreen(){const di=DIFFS.indexOf(S.diff);let nb=false;if(S.gm==='laps'&&S.score>SAVE.best[di]){SAVE.best[di]=S.score;nb=true}if(S.gm==='daily'){const d=S.daily;if(S.score>(SAVE.daily[d.key]||0))SAVE.daily[d.key]=S.score}saveNow();checkUnlocks();
  $('overH').textContent=S.gm==='daily'?'RETO FALLIDO':'FIN DEL TRAYECTO';
  $('overStats').innerHTML=`<div>PUNTOS<span>${S.score}</span></div><div>VUELTA<span>${S.lap+1}</span></div><div>GEMAS<span>${S.gems}</span></div>`+(S.gm==='laps'?`<div>RÉCORD ${S.diff.name}<span class="${nb?'new':''}">${SAVE.best[di]}${nb?' ¡NUEVO!':''}</span></div>`:'');
  S.canCont=S.gm==='laps'&&S.diff.cont;S.contT=10;setTimeout(()=>{if(S.mode==='over')uiOpen('scrOver',0)},900)}

// ==================== input.js
// Input: keyboard, touch (visible buttons or screen halves + swipe), gamepad (standard mapping) and rumble.
const KEYS={jump:['Space','ArrowUp','KeyW','KeyZ','KeyK'],brake:['ArrowDown','KeyS','KeyX','ShiftLeft','ShiftRight','KeyJ'],sw:['KeyE','KeyQ','KeyC','ArrowRight','ArrowLeft','KeyL']};
const PREVENT=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab']);
const held={};
function menuKey(c,rep){const hz=SCREENS[UI.cur]&&SCREENS[UI.cur].axis==='h';
  if(c==='ArrowUp'||c==='KeyW'){if(!hz)uiMove(-1)}
  else if(c==='ArrowDown'||c==='KeyS'){if(!hz)uiMove(1)}
  else if(c==='ArrowLeft'||c==='KeyA'){hz?uiMove(-1):uiAdj(-1)}
  else if(c==='ArrowRight'||c==='KeyD'){hz?uiMove(1):uiAdj(1)}
  else if(!rep&&(c==='Enter'||c==='Space'||c==='KeyZ'||c==='KeyK'))uiOk();
  else if(!rep&&(c==='Escape'||c==='Backspace'||c==='KeyX'))uiBack()}
addEventListener('keydown',e=>{const c=e.code;if(PREVENT.has(c))e.preventDefault();auInit();
  if(UI.cur){menuKey(c,e.repeat);return}
  if(e.repeat)return;held[c]=1;
  if(S.mode==='play'&&!S.paused){
    if(KEYS.jump.includes(c))IN.jumpHit=true;
    if(KEYS.sw.includes(c))IN.swHit=true;
    if(c==='Escape'||c==='KeyP'||c==='Enter')openPause();
    if(c==='KeyR'&&(S.gm==='practice'||S.gm==='trial'))beginSolo(S.world,S.mood,S.gm);
  }
  if(c==='KeyM'){SET.mus=SET.mus?0:7;saveSet();popTxt(SET.mus?'MÚSICA ON':'MÚSICA OFF','#fff')}
  if(c==='KeyB'&&e.shiftKey&&S.gm!=='attract'){S.bot=!S.bot;popTxt(S.bot?'PILOTO AUTOMÁTICO':'MANUAL','#39e6ff')}});
addEventListener('keyup',e=>{held[e.code]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0});
// ---- touch
const TP={j:0,b:0};const PTR={};
const wrapEl=$('wrap');
function tbDown(id,e){e.preventDefault();e.stopPropagation();auInit();const el=e.currentTarget;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(id==='j'){TP.j++;IN.jumpHit=true}else if(id==='b')TP.b++;else if(id==='s')IN.swHit=true;else if(id==='p')openPause()}
function tbUp(id,e){const el=e.currentTarget;el.classList.remove('on');if(id==='j')TP.j=Math.max(0,TP.j-1);else if(id==='b')TP.b=Math.max(0,TP.b-1)}
for(const[id,el]of[['j','tbJ'],['b','tbB'],['s','tbS'],['p','tbP']]){const d=$(el);d.addEventListener('pointerdown',e=>tbDown(id,e));d.addEventListener('pointerup',e=>tbUp(id,e));d.addEventListener('pointercancel',e=>tbUp(id,e))}
wrapEl.addEventListener('pointerdown',e=>{auInit();if(UI.cur||S.mode!=='play'||S.paused)return;if(e.target.closest('.tb'))return;
  const r=wrapEl.getBoundingClientRect(),side=(e.clientX-r.left)<r.width*.4?'b':'j';PTR[e.pointerId]={side,y:e.clientY,t:performance.now(),sw:false};
  if(side==='j'){TP.j++;IN.jumpHit=true}else TP.b++;try{wrapEl.setPointerCapture(e.pointerId)}catch(_){}});
wrapEl.addEventListener('pointermove',e=>{const p=PTR[e.pointerId];if(!p||p.sw)return;if(Math.abs(e.clientY-p.y)>wrapEl.clientHeight*.08&&performance.now()-p.t<400){p.sw=true;IN.swHit=true}});
const ptrUp=e=>{const p=PTR[e.pointerId];if(!p)return;if(p.side==='j')TP.j=Math.max(0,TP.j-1);else TP.b=Math.max(0,TP.b-1);delete PTR[e.pointerId]};
wrapEl.addEventListener('pointerup',ptrUp);wrapEl.addEventListener('pointercancel',ptrUp);
// ---- gamepad
const GP={pad:null,prev:[],dir:'',rep:0,warned:false};
function getPad(){let pads;try{pads=navigator.getGamepads?navigator.getGamepads():[]}catch(e){return null}for(const p of pads||[])if(p&&p.connected)return p;return null}
function rumble(ms,strong=.6,weak=.4){const p=GP.pad;if(!SET.vib||!p||!p.vibrationActuator)return;try{const r=p.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function padWake(){auInit();if(AU.ctx&&AU.ctx.state!=='running'&&!GP.warned){GP.warned=true;setTimeout(()=>{if(AU.ctx&&AU.ctx.state!=='running')popTxt('HAZ CLIC PARA ACTIVAR EL SONIDO','#fff')},400)}}
function padFrame(dt){const p=getPad();if(!p){GP.pad=null;return}GP.pad=p;
  const b=i=>{const x=p.buttons[i];return!!x&&(x.pressed||x.value>.4)};const edge=i=>b(i)&&!GP.prev[i];
  const ax=p.axes[0]||0,ay=p.axes[1]||0;const up=b(12)||ay<-.6,dn=b(13)||ay>.6,lf=b(14)||ax<-.6,rt=b(15)||ax>.6;
  if(UI.cur){const dir=up?'u':dn?'d':lf?'l':rt?'r':'';const nav=d=>{const hz=SCREENS[UI.cur]&&SCREENS[UI.cur].axis==='h';if(d==='u'&&!hz)uiMove(-1);if(d==='d'&&!hz)uiMove(1);if(d==='l')hz?uiMove(-1):uiAdj(-1);if(d==='r')hz?uiMove(1):uiAdj(1)};
    if(dir){if(dir!==GP.dir){GP.dir=dir;GP.rep=.35;nav(dir)}else{GP.rep-=dt;if(GP.rep<=0){GP.rep=.12;nav(dir)}}}else GP.dir='';
    if(edge(0)||edge(9)){padWake();uiOk()}if(edge(1))uiBack()}
  else if(S.mode==='play'&&!S.paused){
    if(edge(0)||edge(12)){padWake();IN.jumpHit=true}
    if(edge(3)||edge(4)||edge(5)||edge(14)||edge(15))IN.swHit=true;
    if(edge(9))openPause();
    if(edge(8)){SET.mus=SET.mus?0:7;saveSet();popTxt(SET.mus?'MÚSICA ON':'MÚSICA OFF','#fff')}
    GP.jump=b(0)||up;GP.brake=b(1)||b(2)||b(6)||b(7)||dn}
  for(let i=0;i<p.buttons.length;i++)GP.prev[i]=b(i);
  if(UI.cur||S.mode!=='play'){GP.jump=false;GP.brake=false}}
addEventListener('gamepadconnected',()=>popTxt('MANDO CONECTADO','#39e6ff'));
addEventListener('gamepaddisconnected',()=>{popTxt('MANDO DESCONECTADO','#ff3b5c');if(S.mode==='play'&&!S.paused)openPause()});
function readInput(){IN.jump=KEYS.jump.some(k=>held[k])||TP.j>0||!!(GP.pad&&GP.jump);IN.brake=KEYS.brake.some(k=>held[k])||TP.b>0||!!(GP.pad&&GP.brake)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play'&&!S.paused)openPause();if(!document.hidden&&AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume()});

// ==================== main.js
// Main loop and boot.
let last=performance.now();
function tick(dt){
  S.T+=dt;
  padFrame(dt);readInput();uiFrame(dt);
  if(S.paused){audioFrame();hud();return}
  const auto=S.gm==='attract'||S.bot;
  if(auto&&(S.mode==='play'||S.mode==='menu')){const b=botInput(dt);IN.jump=b.jump;IN.brake=b.brake;if(b.jumpHit)IN.jumpHit=true;if(b.swHit)IN.swHit=true}
  S.flash=Math.max(0,S.flash-dt*3);
  const active=S.mode==='play'||S.mode==='menu'||S.mode==='lapend'||S.mode==='result';
  if(active){
    let ts=1;if(S.slowT>0){S.slowT-=dt;ts=S.slowA}
    const h=dt*ts;
    near();
    if(C.dead)updDead(h);
    else{updEntities(h);const n=Math.max(1,Math.ceil(h/.004));for(let k=0;k<n;k++){step(h/n);if(C.dead)break}}
    if(S.mode==='play'){S.lapTime+=dt;S.runT+=dt;recGhost(dt)}
    let gi=Math.min(S.gemIdx,GEMS.length);while(gi<GEMS.length&&GEMS[gi].x<C.x-40)gi++;while(gi>0&&GEMS[gi-1].x>C.x-40)gi--;S.gemIdx=gi;
    updParts(h);
    const bi=(C.T.P[C.i]||{}).bi||0,M=moodOf(bi);
    if(M.storm){S.lightT-=dt;if(S.lightT<=0){S.lightT=3+Math.random()*5;S.lightF=SET.flash?1:.45;S.boltX=.2+Math.random()*.6;S.boltSeed=Math.random()*1e6|0;sfx('thunder')}}
    S.lightF=Math.max(0,S.lightF-dt*(S.lightF>.5?2:4));
    if(M.rumble){S.rumbleT-=dt;if(S.rumbleT<=0){S.rumbleT=4+Math.random()*5;S.shake=Math.max(S.shake,4);rumble(300,.4,.2)}}
    computeWarnings();
  }
  const z=cam.z,vw=OW/BASE/z,vh=OH/BASE/z;updWx(dt,cam.x-vw/2,cam.y-vh/2,vw,vh);
  updCam(dt);audioFrame();hud();
  if(saveTimer>0){saveTimer-=dt;if(saveTimer<=0)saveNow()}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);render();requestAnimationFrame(frame)}
toTitle();
requestAnimationFrame(frame);
window.__rs={S,C,cam,E,GEMS,TR,FORKS,CRS,SAVE,SET,DYN,step:(n=60,dt=1/60)=>{for(let k=0;k<n;k++)tick(dt)},render,startRun,beginLaps,beginSolo,beginDaily,toTitle,uiOpen,closeUI,placeAt,respawn,
  get MAIN(){return MAIN},get NEAR(){return NEAR},get UI(){return UI}};

</script>
